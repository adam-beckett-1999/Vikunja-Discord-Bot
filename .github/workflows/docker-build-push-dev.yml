name: Build and Push Docker Image (Dev Branch)

on:
  push:
    branches:
      - 1.0-base-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    concurrency:
      group: docker-dev-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/vikunja-discord-bot
      BUILD_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ env.BUILD_PLATFORMS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Cleanup build cache and images
        if: always()
        run: |
          docker buildx prune --all --force || true
          docker system prune --all --force --volumes || true

      - name: Discord Notification (Success)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "✅ Docker Image Pushed",
                "description": "The image **${{ env.IMAGE_NAME }}:dev** has been successfully pushed to Docker Hub.",
                "color": 3066993,
                "timestamp": "'"$(date --utc +%Y-%m-%dT%H:%M:%SZ)"'",
                "footer": { "text": "GitHub Actions • Build Success" }
              }]
            }' \
            "$DISCORD_WEBHOOK"

      - name: Discord Notification (Failure)
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "❌ Docker Build/Push Failed",
                "description": "Docker build or push failed for **${{ env.IMAGE_NAME }}:dev**.",
                "color": 15158332,
                "timestamp": "'"$(date --utc +%Y-%m-%dT%H:%M:%SZ)"'",
                "footer": { "text": "GitHub Actions • Build Failure" }
              }]
            }' \
            "$DISCORD_WEBHOOK"
