name: Build and Push Docker Image (Dev Branch)

on:
  push:
    branches:
      - initial-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/vikunja-discord-bot
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Discord Notification (Success)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "✅ Docker Image Pushed",
                "description": "The image **${{ env.IMAGE_NAME }}:dev** has been successfully pushed to Docker Hub.",
                "color": 3066993,
                "timestamp": "'"$(date --utc +%Y-%m-%dT%H:%M:%SZ)"'",
                "footer": { "text": "GitHub Actions • Build Success" }
              }]
            }' \
            "$DISCORD_WEBHOOK"

      - name: Discord Notification (Failure)
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "❌ Docker Build/Push Failed",
                "description": "Docker build or push failed for **${{ env.IMAGE_NAME }}:dev**.",
                "color": 15158332,
                "timestamp": "'"$(date --utc +%Y-%m-%dT%H:%M:%SZ)"'",
                "footer": { "text": "GitHub Actions • Build Failure" }
              }]
            }' \
            "$DISCORD_WEBHOOK"
